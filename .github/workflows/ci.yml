name: ci
# Starts the dashboard as a fresh user would on each operating system and exercises it over HTTP.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Parsers and guards
        run: python server.py --selftest
      - name: The other ways to start it
        run: python -m pilothouse --version
      - name: What it sees on this runner
        run: python server.py --doctor
      - name: Start it, discover a service, stop it through the API, then demo mode and the access token
        run: python scripts/smoke.py server.py
